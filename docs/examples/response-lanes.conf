# Example config/response-lanes.conf - copy into this home's local, gitignored
# config/response-lanes.conf and replace the lane names and paths with this
# fleet's own. docs/configuration.md "Response lanes" owns the schema and the
# reasoning behind every default below.
#
# Thresholds, in seconds, with the reasoning beside each. Omit a line to keep
# the default the script carries.

# W - the supervision beat age at which a lane's own supervision is treated as
# stopped. A healthy home beats every 20 to 180 seconds, so 900 is several
# missed beats rather than one slow poll, and a genuinely stopped home passes it
# within a quarter hour. Above half of W the lane reads degraded instead.
W=900

# D - how long the oldest undelivered-to-work message may sit in a lane that has
# never handled anything before that lane is treated as dead. Half an hour is
# longer than any normal turn, so a busy worker is not called dead, while a lane
# that has taken nothing in days is unambiguous.
D=1800

# E - how long a transport or budget error class must hold before it is treated
# as dead rather than a passing blip. Ten minutes outlasts a provider retry
# window and a rate-limit cooldown, so a recoverable stall is not paged.
E=600

# M - the percentage of a lane's tracked requests that may stand unanswered
# before the lane reads degraded while its agent is still alive. Above half
# means the lane is receiving more than it answers.
M=50

# SELF - how long the rail itself may go without completing a sweep before the
# rail-silence check reports it. It matches W because a rail that stopped
# reporting is as serious as a lane whose supervision stopped.
SELF=900

# SSH_TIMEOUT - the bound on a single remote lane read. The watcher allows 30
# seconds per check, so this stays small enough that one unreachable host cannot
# consume the whole sweep.
SSH_TIMEOUT=10

# CAPTURE_TIMEOUT - the bound on reading one lane's pane for its error
# signature. A pane that does not answer within it reads unknown, not none.
CAPTURE_TIMEOUT=8

# Lanes, one per line: `lane <name> [inbox-path]`.
#
# <name> is the lane's own record name in this home's state, so the rail reads
# its home, host, and endpoint from state/<name>.meta rather than repeating them
# here. The inbox path is optional and only needed when a lane's inbox is not
# where the record implies: a local lane defaults to state/<name>.inbox, and a
# lane whose record carries remote_host= defaults to
# <its home>/state/parent-route/<name>.inbox on that host.
#
# A lane with no local inbox directory is NOT a lane with an empty inbox. Name
# such a lane here anyway and let the rail read it over its own host: a local
# zero-depth reading for an inbox that lives somewhere else is the exact false
# health signal this rail exists to catch.
lane gpu-ops
lane stack-monitor
lane monitor-sre
lane portal-ops
lane svc-ops
